# Render.com blueprint: the whole Deli's demo (frontend + backend + ws-bridge +
# Postgres + Redis) on a single platform, for a client preview.
#
# The frontend is a static site that proxies /api/* and /ws/* to the two web
# services below (see "routes"), so the browser only ever talks to one origin
# (delis-front's own onrender.com URL) — no CORS configuration needed beyond
# listing that one domain. (front/vercel.json is kept as an alternative if you
# ever want the frontend on Vercel instead; unused here.)
#
# Login skip for the client: set DEMO_LOGIN_EMAIL / DEMO_LOGIN_PASSWORD on the
# delis-front service to an account you created by visiting the deployed site's
# /register once — opening the site then signs that account in automatically
# and lands on the dashboard, no login screen. Leave both blank to show the
# normal login page instead.
#
# Demo data: free-tier Render has no Shell tab and no pre-deploy command, so
# seeding runs at backend startup instead, gated by an env var on delis-back
# (back/app/main.py, after migrations run):
#   SEED_DEMO_DATA=true    -> adds a chicken menu, 4 tables and a spread of
#                              orders, all named with "(DEMO)". Idempotent —
#                              safe to leave true across restarts/redeploys.
#   REMOVE_DEMO_DATA=true  -> deletes exactly those "(DEMO)"-named rows and
#                              nothing else, once, then is a no-op. Takes
#                              priority over SEED_DEMO_DATA if both are true.
# Flip the value in delis-back's Environment tab and Render restarts the
# service on its own (no manual deploy needed) — this is a normal env var,
# not a build/deploy command, so it works on the free plan.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance ->
# point at this repo/branch (feature/delis-rebrand) -> Apply.
#
# After the first deploy, three manual edits (Render does not let a blueprint
# safely guess these ahead of time):
#  1. Render may have appended a suffix to a service's onrender.com subdomain
#     if "delis-back" / "delis-ws-bridge" / "delis-front" were taken. If so,
#     update delis-front's two route destinations below to the real URLs.
#  2. Set delis-back's and delis-ws-bridge's CORS_ORIGINS to delis-front's
#     real URL (https://delis-front[-xxxx].onrender.com, no trailing slash).
#  3. Register an account via /register on the live site, then set
#     DEMO_LOGIN_EMAIL / DEMO_LOGIN_PASSWORD on delis-front and redeploy it.

envVarGroups:
  - name: delis-shared-secrets
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true

databases:
  - name: delis-db
    databaseName: delis
    user: delis
    plan: free

services:
  - type: redis
    name: delis-redis
    plan: free
    ipAllowList: []

  - type: web
    name: delis-back
    runtime: docker
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    plan: free
    healthCheckPath: /docs
    envVars:
      - fromGroup: delis-shared-secrets
      # See header comment: seeds Deli's demo data at startup (free-tier-safe).
      - key: SEED_DEMO_DATA
        value: "true"
      - key: REMOVE_DEMO_DATA
        value: "false"
      - key: DB_HOST
        fromDatabase: { name: delis-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: delis-db, property: port }
      - key: DB_USER
        fromDatabase: { name: delis-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: delis-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: delis-db, property: database }
      - key: REDIS_URL
        fromService: { type: redis, name: delis-redis, property: connectionString }
      # Fill in after the first deploy — see header comment, step 2.
      - key: CORS_ORIGINS
        value: https://delis-front.onrender.com
      - key: STRIPE_CURRENCY
        value: bob

  - type: web
    name: delis-ws-bridge
    runtime: docker
    dockerfilePath: ./ws-bridge/Dockerfile.render
    dockerContext: ./ws-bridge
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: delis-shared-secrets
      - key: REDIS_URL
        fromService: { type: redis, name: delis-redis, property: connectionString }
      - key: ALGORITHM
        value: HS256
      - key: API_URL
        fromService: { type: web, name: delis-back, property: host }
      # Fill in after the first deploy — see header comment, step 2.
      - key: CORS_ORIGINS
        value: https://delis-front.onrender.com

  - type: web
    name: delis-front
    runtime: static
    rootDir: front
    buildCommand: npm ci --ignore-scripts && node scripts/write-dev-login.js && npm run build -- --configuration production-static
    staticPublishPath: ./dist/front/browser
    envVars:
      # Fill in after you've registered via /register on the live site — see
      # header comment, step 3. Leave both blank to show the normal login page.
      - key: DEMO_LOGIN_EMAIL
        value: ""
      - key: DEMO_LOGIN_PASSWORD
        value: ""
    routes:
      # Update these two if Render suffixed delis-back / delis-ws-bridge's
      # subdomain — see header comment, step 1.
      - type: rewrite
        source: /api/*
        destination: https://delis-back.onrender.com/*
      - type: rewrite
        source: /ws/*
        destination: https://delis-ws-bridge.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
